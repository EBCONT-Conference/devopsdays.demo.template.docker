name: Entrypoint

on:
  workflow_dispatch:
    inputs:
      build:
        type: boolean
        default: false
        description: "Run build"
      deploy:
        type: boolean
        default: false
        description: "Run deploy"
  push:
    paths:
      - 'src/**'
      - 'Dockerfile'
    branches-ignore:
      - 'release-please**'
    
jobs:
  build:
    name: Build
    if: ${{ inputs.build == true || github.event_name == 'push' }}
    uses: EBCONT-Conference/devopsdays.demo.reusable-workflow.build.docker/.github/workflows/entrypoint.yml@v1
    secrets: inherit

